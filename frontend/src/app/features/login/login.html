<div class="login-wrap">
  <mat-card appearance="outlined" class="login-card">
    <mat-card-header>
      <mat-card-title>{{ mode() === 'register' ? 'Create an account' : 'Log in' }}</mat-card-title>
      <mat-card-subtitle>📚 Books Management</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="submit()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" required />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" required />
        </mat-form-field>
        @if (error()) {
          <p class="error">{{ error() }}</p>
        }
        <button mat-flat-button color="primary" type="submit">{{ mode() === 'register' ? 'Register' : 'Log in' }}</button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button type="button" (click)="toggleMode()">
        {{ mode() === 'register' ? 'Already have an account? Log in' : 'Need an account? Register' }}
      </button>
    </mat-card-actions>
    <div class="demo-divider">
      <span>or</span>
    </div>
    <mat-card-actions>
      <button mat-stroked-button type="button" class="demo-button" [disabled]="demoLoading()" (click)="tryDemo()">
        <mat-icon>play_circle</mat-icon>
        {{ demoLoading() ? 'Starting demo…' : 'Try the demo (no account needed)' }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
